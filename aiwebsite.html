
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OrbitX — Movie Picker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html,body{
  margin:0;
  padding:0;
  overflow:hidden;
  background:#0f172a;
  font-family:Inter,Arial,Helvetica,sans-serif;
}

/* TITLE */
.overlay{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  color:#e5e7eb;
  z-index:2;
}
.overlay h1{font-size:3.2rem}
.overlay span{color:#38bdf8}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(2,6,23,.55);
  backdrop-filter:blur(14px);
  opacity:0;
  pointer-events:none;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.35s ease;
  z-index:10;
}
.modal.active{opacity:1;pointer-events:auto}

.card{
  width:380px;
  padding:28px;
  border-radius:22px;
  background:linear-gradient(180deg,rgba(15,23,42,.95),rgba(2,6,23,.98));
  border:1px solid rgba(56,189,248,.15);
  box-shadow:0 30px 80px rgba(0,0,0,.55);
  transform:translateY(40px) scale(.9);
  opacity:0;
  transition:.45s cubic-bezier(.2,.9,.3,1);
}
.modal.active .card{
  transform:translateY(0) scale(1);
  opacity:1;
}

.card h2{margin:0;color:#38bdf8;text-align:center}
.meta{text-align:center;opacity:.75;margin-top:6px}

.divider{
  height:1px;
  background:linear-gradient(to right,transparent,rgba(56,189,248,.4),transparent);
  margin:18px 0;
}

.platforms{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
}

.platform{
  padding:6px 14px;
  border-radius:999px;
  font-size:.82rem;
  background:rgba(15,23,42,.9);
  border:1px solid rgba(56,189,248,.25);
  color:#e5e7eb;
  cursor:pointer;
  transition:.2s ease;
}
.platform:hover{
  background:rgba(56,189,248,.25);
  transform:scale(1.05);
}

.close{
  margin-top:22px;
  width:100%;
  padding:10px;
  border-radius:12px;
  border:none;
  cursor:pointer;
  background:rgba(56,189,248,.15);
  color:#38bdf8;
  font-weight:600;
}

/* IMPORTANT FIX */
canvas{
  position:fixed;
  inset:0;
  z-index:1;
  pointer-events:none; /* THIS FIXES CLOSE BUTTON */
}
</style>
</head>

<body>

<div class="overlay">
  <h1>Orbit<span>X</span></h1>
</div>

<div class="modal" id="modal">
  <div class="card">
    <h2 id="movieTitle"></h2>
    <div class="meta" id="movieMeta"></div>
    <div class="divider"></div>
    <div class="platforms" id="moviePlatforms"></div>
    <button class="close" onclick="closeModal()">Close</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<script>
/* PLATFORM LINKS */
const PLATFORM_LINKS={
  Netflix:"https://www.netflix.com",
  Prime:"https://www.primevideo.com",
  "Amazon Prime":"https://www.primevideo.com",
  HBO:"https://www.max.com",
  "HBO Max":"https://www.max.com",
  "Disney+":"https://www.disneyplus.com",
  "Apple TV":"https://tv.apple.com"
};

/* MOVIES */
const MOVIES=[
"Inception","Interstellar","The Dark Knight","Parasite","Whiplash","The Matrix","Gladiator","Joker","Titanic","The Prestige",
"Forrest Gump","Fight Club","The Shawshank Redemption","The Godfather","The Godfather Part II","Pulp Fiction","Se7en","Goodfellas","The Departed","Schindler's List",
"12 Angry Men","The Lord of the Rings: The Fellowship of the Ring","The Two Towers","The Return of the King","The Lion King","Avengers: Endgame","Avengers: Infinity War",
"Toy Story","Up","WALL-E","Coco","Finding Nemo","Alien","Blade Runner 2049","Mad Max: Fury Road","Shutter Island","Jurassic Park","Back to the Future","Rocky","Creed",
"La La Land","The Big Short","No Country for Old Men","The Social Network","Logan","Deadpool","Her","Arrival","Gravity","The Grand Budapest Hotel",
"A Beautiful Mind","Cast Away","The Green Mile","The Pianist","Memento","The Revenant","Moonlight","Drive","Oldboy","Amélie",
"Harry Potter and the Sorcerer's Stone","Harry Potter and the Prisoner of Azkaban","Dune","The Wolf of Wall Street","Saving Private Ryan","Braveheart",
"Black Swan","The Imitation Game","The Silence of the Lambs","The Truman Show","The Avengers","Iron Man","Captain America: Civil War","The Dark Knight Rises",
"Spider-Man: Into the Spider-Verse","The Batman","Oppenheimer","Barbie","Everything Everywhere All at Once","Top Gun: Maverick","John Wick"
].map(title=>({
  title,
  year:"—",
  genre:"Movie",
  platforms:["Netflix","Prime","HBO","Disney+"].sort(()=>0.5-Math.random()).slice(0,2)
}));

/* THREE */
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,1000);
camera.position.z=95;

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

/* PARTICLES */
const TOTAL=1600;
const geo=new THREE.BufferGeometry();
const pos=new Float32Array(TOTAL*3);
const base=new Float32Array(TOTAL*3);
const size=new Float32Array(TOTAL);
const color=new Float32Array(TOTAL*3);

const map=new Map();
const used=new Set();
while(used.size<MOVIES.length)used.add(Math.floor(Math.random()*TOTAL));
[...used].forEach((i,j)=>map.set(i,MOVIES[j]));

for(let i=0;i<TOTAL;i++){
  const x=(Math.random()-.5)*320;
  const y=(Math.random()-.5)*320;
  const z=(Math.random()-.5)*320;
  pos.set([x,y,z],i*3);
  base.set([x,y,z],i*3);
  if(map.has(i)){size[i]=8;color.set([1,1,1],i*3);}
  else{size[i]=1.4;color.set([.22,.74,.97],i*3);}
}

geo.setAttribute("position",new THREE.BufferAttribute(pos,3));
geo.setAttribute("size",new THREE.BufferAttribute(size,1));
geo.setAttribute("color",new THREE.BufferAttribute(color,3));

const mat=new THREE.ShaderMaterial({
  transparent:true,depthWrite:false,vertexColors:true,
  vertexShader:`attribute float size;varying vec3 vColor;
  void main(){vColor=color;vec4 mv=modelViewMatrix*vec4(position,1.);
  gl_PointSize=size*(300./-mv.z);gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`varying vec3 vColor;
  void main(){if(distance(gl_PointCoord,vec2(.5))>.5)discard;
  gl_FragColor=vec4(vColor,1.);}`
});
const points=new THREE.Points(geo,mat);
scene.add(points);

/* INTERACTION */
const mouse=new THREE.Vector2();
addEventListener("mousemove",e=>{
  mouse.x=(e.clientX/innerWidth)*2-1;
  mouse.y=-(e.clientY/innerHeight)*2+1;
});

const ray=new THREE.Raycaster();
ray.params.Points.threshold=35;
let slowed=false;

addEventListener("click",()=>{
  ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObject(points);
  let best=null,dist=Infinity;
  for(const h of hits){
    if(map.has(h.index)&&h.distance<dist){
      best=h;dist=h.distance;
    }
  }
  if(best)showMovie(map.get(best.index));
});

/* ANIMATION */
function animate(t){
  t*=0.002;
  for(let i=0;i<TOTAL;i++){
    const ix=i*3;
    const dx=pos[ix]-mouse.x*90;
    const dy=pos[ix+1]-mouse.y*90;
    const d=Math.sqrt(dx*dx+dy*dy)||1;
    if(d<100){pos[ix]+=dx*.012;pos[ix+1]+=dy*.012;}
    pos[ix]+=(base[ix]-pos[ix])*.02;
    pos[ix+1]+=(base[ix+1]-pos[ix+1])*.02;
    pos[ix+2]+=(base[ix+2]-pos[ix+2])*.02;
    if(map.has(i))size[i]=8+Math.sin(t+i)*1.4;
  }
  geo.attributes.position.needsUpdate=true;
  geo.attributes.size.needsUpdate=true;
  points.rotation.y+=slowed?.00015:.00045;
  points.rotation.x+=slowed?.0001:.00025;
  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
animate();

/* MODAL */
function showMovie(m){
  slowed=true;
  movieTitle.textContent=m.title;
  movieMeta.textContent=`${m.year} • ${m.genre}`;
  moviePlatforms.innerHTML="";
  m.platforms.forEach(p=>{
    const b=document.createElement("button");
    b.className="platform";
    b.textContent=p;
    b.onclick=()=>window.open(PLATFORM_LINKS[p],"_blank","noopener,noreferrer");
    moviePlatforms.appendChild(b);
  });
  modal.classList.add("active");
}
function closeModal(){
  slowed=false;
  modal.classList.remove("active");
}
</script>

</body>
</html>
